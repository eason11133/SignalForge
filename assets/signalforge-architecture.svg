<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg { fill:#f7f8f6; }
      .main { fill:#eef5fb; stroke:#9bbbd3; stroke-width:2; }
      .memory { fill:#f1f0f7; stroke:#aaa8c3; stroke-width:2; }
      .neutral { fill:#f2f2ef; stroke:#b8b8b0; stroke-width:2; }
      .text { font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill:#20252b; font-size:26px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .small { font-family: Inter, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; fill:#4b535b; font-size:22px; font-weight:600; text-anchor:middle; dominant-baseline:middle; }
      .arrow { stroke:#69747e; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#8b8f92; stroke-width:2.5; stroke-dasharray:9 8; fill:none; marker-end:url(#arrowGray); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#69747e"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8b8f92"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="900"/>

  <rect class="main" x="95" y="110" rx="18" ry="18" width="250" height="100"/>
