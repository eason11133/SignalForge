  <rect class="main" x="765" y="110" rx="18" ry="18" width="250" height="100"/>
  <text class="text" x="890" y="160">相關性判斷</text>

  <rect class="main" x="1100" y="110" rx="18" ry="18" width="250" height="100"/>
  <text class="text" x="1225" y="160">去重與分類</text>

  <path class="arrow" d="M345 160 H430"/>
  <path class="arrow" d="M680 160 H765"/>
  <path class="arrow" d="M1015 160 H1100"/>

  <rect class="neutral" x="430" y="285" rx="16" ry="16" width="250" height="90"/>
  <text class="small" x="555" y="330">來源失敗處理</text>
  <path class="dash" d="M555 210 V285"/>

  <rect class="memory" x="830" y="360" rx="18" ry="18" width="300" height="105"/>
  <text class="text" x="980" y="412">Evidence Memory</text>

  <rect class="memory" x="1170" y="360" rx="18" ry="18" width="330" height="105"/>
  <text class="text" x="1335" y="398">Actor / Behavior</text>
  <text class="text" x="1335" y="432">Tracking</text>

  <path class="arrow" d="M1225 210 V292 H980 V360"/>
  <path class="arrow" d="M1225 210 V292 H1335 V360"/>

  <rect class="memory" x="930" y="560" rx="18" ry="18" width="470" height="110"/>
  <text class="text" x="1165" y="600">Repeated Patterns</text>
